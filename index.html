<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>UGH! — Prehistoric Space Taxi · V10</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
  }
}
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#090b12;color:#fff;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:12px;box-sizing:border-box}
.top{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#101522cc;border:1px solid #ffffff20;border-radius:12px;padding:7px 11px;backdrop-filter:blur(8px);box-shadow:0 5px 18px #0008}
.label{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.12em}
.value{font-weight:800;font-size:18px}
#msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);text-align:center;text-shadow:0 3px 10px #000;font-weight:900}
#passenger{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-weight:800;background:#101522dd;padding:8px 14px;border-radius:14px;display:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.stick{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid #ffffff38;background:#ffffff0c;pointer-events:auto;touch-action:none}
.knob{position:absolute;width:50px;height:50px;border-radius:50%;left:32px;top:32px;background:#ffffff35;border:1px solid #ffffff55}
#left{left:18px;bottom:25px}#right{right:18px;bottom:25px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#263a46ee,#090b12 70%);z-index:4}
.panel{max-width:520px;margin:20px;text-align:center;background:#101522e8;border:1px solid #ffffff22;border-radius:22px;padding:30px;box-shadow:0 20px 80px #000c}
h1{font-size:48px;margin:0 0 4px;letter-spacing:.06em}p{opacity:.8}
button{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:16px;background:#e8b84a;color:#21170a;cursor:pointer}
.small{font-size:12px;opacity:.6;margin-top:15px}
@media(pointer:coarse){#touch{display:block}}
</style>
</head>
<body style="overscroll-behavior:none">
<div id="menu"><div class="panel"><h1>UGH!</h1><div>PREHISTORIC SPACE TAXI</div><p>Transporte les passagers avant que l'eau ne monte.</p><p>Meilleur score : <b id="best">0</b></p><button id="start">DÉCOLLER</button><div class="small">Clavier : A/D ou ←/→ · W/↑ pour pédaler · S/↓ frein · P pause · Mobile : doubles joysticks</div></div></div>
<div id="hud">
  <div class="top">
    <div class="card"><div class="label">Score</div><div id="score" class="value">000000</div></div>
    <div class="card"><div class="label">Lives</div><div id="lives" class="value">♥♥♥</div></div>
    <div class="card"><div class="label">Level</div><div id="level" class="value">1 / 5</div></div>
    <div class="card"><div class="label">Stamina</div><div id="stamina" class="value">100%</div></div>
    <div class="card"><div class="label">Water</div><div id="water" class="value">0%</div></div>
  </div>
  <div id="msg"></div><div id="passenger"></div>
</div>
<div id="touch"><div id="left" class="stick"><div class="knob"></div></div><div id="right" class="stick"><div class="knob"></div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
